var D={};
D.what=function(){crd.innerHTML=bg()+'<div class="ctitle">What Is Neuro-Symbolic AI?</div><div class="cdesc">Current AI (like ChatGPT) is a <b>neural network</b> — it learns patterns from data, like a student who memorizes answers. But it doesn\'t truly "understand" rules or logic.<br><br><b>Neuro-Symbolic AI</b> combines:<br>• <b>Neural</b> = pattern recognition (seeing, hearing, language)<br>• <b>Symbolic</b> = logical reasoning (rules, planning, math)<br><br>Result: AI that can <b>perceive AND reason</b> — like a human brain.</div>'+'<div class="arch"><div class="abox" style="border-color:var(--blue);color:var(--blue)"><span class="ic">👁️</span>See<br><span style="font-size:.6rem;color:var(--sub)">Neural Net</span></div><span class="aarr">+</span><div class="abox" style="border-color:var(--purple);color:var(--purple)"><span class="ic">📐</span>Reason<br><span style="font-size:.6rem;color:var(--sub)">Symbolic Logic</span></div><span class="aarr">=</span><div class="abox" style="border-color:var(--neon);color:var(--neon);box-shadow:0 0 15px rgba(0,240,255,.15)"><span class="ic">🧠</span>Think<br><span style="font-size:.6rem;color:var(--sub)">Neuro-Symbolic</span></div></div>'+'<div class="hint" style="background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.15)"><b style="color:var(--neon)">🎯 Analogy:</b><br><b style="color:var(--blue)">Neural Net</b> = student who memorizes 1M answers without understanding why.<br><b style="color:var(--purple)">Symbolic AI</b> = calculator that follows rules perfectly but can\'t learn.<br><b style="color:var(--neon)">Neuro-Symbolic</b> = student who memorizes AND understands — solves new problems never seen before.</div>'+'<div class="compare"><div><h4 style="color:var(--blue)">🔵 Neural Networks</h4><ul><li>✅ Learns from data</li><li>✅ Handles messy input</li><li>✅ Creates text, images</li><li>❌ Hallucinates facts</li><li>❌ Can\'t explain why</li><li>❌ Massive energy use</li></ul></div><div><h4 style="color:var(--purple)">🟣 Symbolic AI</h4><ul><li>✅ Perfect logic</li><li>✅ 100% explainable</li><li>✅ Low energy</li><li>❌ Can\'t learn new things</li><li>❌ Rules hand-coded</li><li>❌ Brittle & rigid</li></ul></div><div style="border-color:var(--neon)30"><h4 style="color:var(--neon)">✅ Neuro-Symbolic</h4><ul><li>✅ Learns AND reasons</li><li>✅ Explainable decisions</li><li>✅ Works with small data</li><li>✅ 100x less energy</li><li>✅ Transfers to new tasks</li><li>✅ Self-correcting</li></ul></div></div>'+nb();};

D.why=function(){crd.innerHTML=bg()+'<div class="ctitle">Why Does It Matter Now?</div><div class="cdesc">In April 2026, <b>Tufts University</b> published a breakthrough: neuro-symbolic AI achieves <b>95% accuracy</b> where pure neural nets hit only 34% — using <b>100x less energy</b>.</div>'+'<div class="metrics"><div class="metric"><div class="v" style="color:var(--neon)">95%</div><div class="l">Neuro-Symbolic Accuracy</div></div><div class="metric"><div class="v" style="color:var(--red)">34%</div><div class="l">Pure Neural Accuracy</div></div><div class="metric"><div class="v" style="color:var(--green)">100x</div><div class="l">Less Energy</div></div><div class="metric"><div class="v" style="color:var(--gold)">78%</div><div class="l">Zero-Shot Transfer</div></div></div>'+'<div class="hint" style="background:rgba(255,61,92,.04);border:1px solid rgba(255,61,92,.15)"><b style="color:var(--red)">⚡ The Energy Crisis:</b> AI used <b>415 terawatt hours</b> in 2024 — over 10% of US electricity. Demand projected to <b>double by 2030</b>. We need dramatically more efficient AI.</div>'+'<div style="font-size:.86rem;font-weight:700;color:var(--text);margin:16px 0 10px">🔥 4 Problems It Solves</div>';var probs=[{ic:"🎭",t:"Hallucination",d:"Neural nets make up facts. Symbolic rules constrain outputs to be logically valid.",c:"var(--red)"},{ic:"⚡",t:"Energy Waste",d:"Training GPT-4 costs ~$100M. Neuro-symbolic needs 100x less compute.",c:"var(--orange)"},{ic:"🤷",t:"Black Box",d:"Can\'t explain why it decided. Symbolic reasoning gives full audit trail.",c:"var(--purple)"},{ic:"🔄",t:"Transfer Failure",d:"Neural nets struggle with new tasks. Symbolic rules generalize naturally.",c:"var(--blue)"}];probs.forEach(function(p){crd.innerHTML+='<div style="display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)"><span style="font-size:1.3rem">'+p.ic+'</span><div><div style="font-weight:700;color:'+p.c+';font-size:.88rem">'+p.t+'</div><div style="font-size:.82rem;color:var(--sub);font-family:Georgia,serif;margin-top:2px">'+p.d+'</div></div></div>';});crd.innerHTML+=nb();};

D.how=function(){crd.innerHTML=bg()+'<div class="ctitle">How Neuro-Symbolic AI Works</div><div class="cdesc">Two layers working together: a <b>neural perception layer</b> (understands the world) and a <b>symbolic reasoning layer</b> (thinks about it logically).</div>'+'<div class="arch"><div class="abox" style="border-color:var(--blue);color:var(--blue)"><span class="ic">📸</span>Perception<br><span style="font-size:.6rem;color:var(--sub)">Neural: sees images,<br>text, audio</span></div><span class="aarr">→</span><div class="abox" style="border-color:var(--gold);color:var(--gold)"><span class="ic">🏷️</span>Concepts<br><span style="font-size:.6rem;color:var(--sub)">Extracts: "red",<br>"round", "left-of"</span></div><span class="aarr">→</span><div class="abox" style="border-color:var(--purple);color:var(--purple)"><span class="ic">📐</span>Reasoning<br><span style="font-size:.6rem;color:var(--sub)">Applies rules:<br>"if X then Y"</span></div><span class="aarr">→</span><div class="abox" style="border-color:var(--green);color:var(--green)"><span class="ic">🎯</span>Action<br><span style="font-size:.6rem;color:var(--sub)">Plans, verifies,<br>executes</span></div></div>';var steps=[{n:1,t:"Perceive",d:"Neural net processes raw input and recognizes objects, words, patterns.",c:"var(--blue)",ex:'Sees image → "red block", "blue block", "table"'},{n:2,t:"Abstract",d:"Converts neural outputs into symbolic concepts — discrete building blocks.",c:"var(--gold)",ex:'Object(color=red, shape=cube, pos=[2,3])'},{n:3,t:"Reason",d:"Applies logical rules to plan and verify. Can explain every step.",c:"var(--purple)",ex:'"can_stack(X,Y) if size(X) < size(Y)" → Plans tower'},{n:4,t:"Act",d:"Executes the plan. If error detected, replans automatically.",c:"var(--green)",ex:"Moves block, verifies stability. Done ✓"}];steps.forEach(function(s){crd.innerHTML+='<div style="display:flex;gap:12px;padding:12px;margin:6px 0;border-radius:10px;background:var(--bg);border:1px solid var(--border)"><div style="min-width:32px;height:32px;border-radius:50%;background:'+s.c+'20;border:2px solid '+s.c+';display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800;color:'+s.c+'">'+s.n+'</div><div><div style="font-weight:700;color:'+s.c+';font-size:.88rem">'+s.t+'</div><div style="font-size:.82rem;color:var(--sub);font-family:Georgia,serif;margin:3px 0">'+s.d+'</div><div style="font-size:.76rem;color:'+s.c+';font-family:Courier New,monospace;background:'+s.c+'08;padding:4px 10px;border-radius:6px;border:1px solid '+s.c+'20">'+s.ex+'</div></div></div>';});crd.innerHTML+='<div class="hint" style="background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.15)"><b style="color:var(--neon)">🔑 Key:</b> Neural handles the <b>messy real world</b>. Symbolic handles <b>precise reasoning</b>. Together they cover each other\'s weaknesses.</div>'+nb();};

D.game=function(){crd.innerHTML=bg()+'<div class="ctitle">Live Demo: Tower of Hanoi</div><div class="cdesc">Move all disks from Peg A to Peg C. Never place larger on smaller. Compare <b>neural net</b> (trial & error) vs <b>neuro-symbolic</b> (rules + planning).</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px"><button class="btn" style="background:var(--red);color:var(--bg)" onclick="runN()">🎲 Neural Net</button><button class="btn" style="background:var(--neon);color:var(--bg)" onclick="runNS()">🧠 Neuro-Symbolic</button><button class="btn2" onclick="resetG()">↺ Reset</button></div><div class="hanoi-area" id="hanoi"><div class="peg" id="peg0" data-label="Peg A"></div><div class="peg" id="peg1" data-label="Peg B"></div><div class="peg" id="peg2" data-label="Peg C"></div></div><div class="metrics"><div class="metric"><div class="v" id="m_mv" style="color:var(--gold)">0</div><div class="l">Moves</div></div><div class="metric"><div class="v" id="m_er" style="color:var(--red)">0</div><div class="l">Errors</div></div><div class="metric"><div class="v" id="m_en" style="color:var(--neon)">0</div><div class="l">Energy</div></div><div class="metric"><div class="v" id="m_st" style="color:var(--sub);font-size:.85rem">Ready</div><div class="l">Status</div></div></div><div class="log" id="gl"></div><div id="gr"></div>'+nb();window._p=[[3,2,1,0],[],[]];window._mv=0;window._er=0;window._en=0;rP();};
var _c=["#00f0ff","#ff3daa","#ffd23d","#a8ff3d"],_w=[120,96,72,52],_nr=null,_nsr=null;
window.rP=function(){for(var i=0;i<3;i++){var e=document.getElementById("peg"+i);if(!e)return;e.innerHTML="";for(var j=0;j<window._p[i].length;j++){var d=window._p[i][j],v=document.createElement("div");v.className="disk";v.style.width=_w[d]+"px";v.style.background=_c[d];v.textContent=d+1;e.appendChild(v);}}};
window.gl=function(m,c){var l=document.getElementById("gl");if(!l)return;l.innerHTML+='<div style="color:'+c+'">'+m+'</div>';l.scrollTop=l.scrollHeight;};
window.md=function(f,t){if(!window._p[f].length)return false;var d=window._p[f][window._p[f].length-1];if(window._p[t].length>0&&window._p[t][window._p[t].length-1]<d){window._er++;window._en+=5;document.getElementById("m_er").textContent=window._er;document.getElementById("m_en").textContent=window._en;gl("❌ Can't place disk "+(d+1)+" on smaller! (#"+window._er+")","var(--red)");return false;}window._p[f].pop();window._p[t].push(d);window._mv++;window._en++;document.getElementById("m_mv").textContent=window._mv;document.getElementById("m_en").textContent=window._en;gl("Move "+(d+1)+": "+["A","B","C"][f]+"→"+["A","B","C"][t],"var(--sub)");rP();return true;};
window.resetG=function(){clr();window._p=[[3,2,1,0],[],[]];window._mv=0;window._er=0;window._en=0;_nr=null;_nsr=null;document.getElementById("m_mv").textContent="0";document.getElementById("m_er").textContent="0";document.getElementById("m_en").textContent="0";document.getElementById("m_st").textContent="Ready";document.getElementById("m_st").style.color="var(--sub)";document.getElementById("gl").innerHTML="";document.getElementById("gr").innerHTML="";rP();};
window.runN=function(){resetG();document.getElementById("m_st").textContent="Neural...";document.getElementById("m_st").style.color="var(--red)";gl("🎲 Neural Net: statistical trial & error","var(--gold)");var s=0;function t(){if(window._p[2].length===4||s>60){if(window._p[2].length===4){gl("✅ Solved with "+window._er+" errors, "+window._mv+" moves","var(--green)");document.getElementById("m_st").textContent="Solved ✓";document.getElementById("m_st").style.color="var(--green)";}else{gl("❌ Failed after 60 attempts","var(--red)");document.getElementById("m_st").textContent="Failed ✗";document.getElementById("m_st").style.color="var(--red)";}_nr={mv:window._mv,er:window._er,en:window._en,f:window._p[2].length<4};uGR();return;}var f=Math.floor(Math.random()*3),to=Math.floor(Math.random()*3);while(to===f)to=Math.floor(Math.random()*3);if(Math.random()<.2){var bf=Math.floor(Math.random()*3);if(!window._p[bf].length){window._er++;window._en+=5;document.getElementById("m_er").textContent=window._er;document.getElementById("m_en").textContent=window._en;gl("❌ Empty peg hallucination!","var(--red)");}else md(bf,to);}else{if(window._p[f].length)md(f,to);}s++;timers.push(setTimeout(t,200));}t();};
window.runNS=function(){resetG();document.getElementById("m_st").textContent="Neuro-Sym...";document.getElementById("m_st").style.color="var(--neon)";gl("🧠 Neuro-Symbolic: rules + recursive planning","var(--gold)");gl("Rule: never place larger on smaller","var(--gold)");var m=[];function h(n,f,t,a){if(!n)return;h(n-1,f,a,t);m.push([f,t]);h(n-1,a,t,f);}h(4,0,2,1);var i=0;function t(){if(i>=m.length){gl("✅ Optimal! "+window._mv+" moves, 0 errors","var(--green)");document.getElementById("m_st").textContent="Optimal ✓";document.getElementById("m_st").style.color="var(--neon)";_nsr={mv:window._mv,er:window._er,en:window._en};uGR();return;}md(m[i][0],m[i][1]);i++;timers.push(setTimeout(t,280));}t();};
window.uGR=function(){if(!_nr||!_nsr)return;document.getElementById("gr").innerHTML='<div style="margin-top:16px;padding:16px;border-radius:12px;background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.15)"><div style="font-weight:700;color:var(--neon);margin-bottom:10px">📊 Head-to-Head Results</div><table class="tbl"><tr><th></th><th style="color:var(--red)">🎲 Neural</th><th style="color:var(--neon)">🧠 Neuro-Sym</th><th>Winner</th></tr><tr><td style="color:var(--sub)">Moves</td><td style="color:var(--red)">'+(_nr.f?"FAILED":_nr.mv)+'</td><td style="color:var(--neon)">'+_nsr.mv+' (optimal)</td><td>🧠</td></tr><tr><td style="color:var(--sub)">Errors</td><td style="color:var(--red)">'+_nr.er+'</td><td style="color:var(--green)">0</td><td>🧠</td></tr><tr><td style="color:var(--sub)">Energy</td><td style="color:var(--red)">'+_nr.en+'</td><td style="color:var(--neon)">'+_nsr.en+'</td><td>🧠 ('+Math.round(_nr.en/Math.max(_nsr.en,1))+'x less)</td></tr></table></div>';};

D.code=function(){crd.innerHTML=bg()+'<div class="ctitle">Code: Building a Neuro-Symbolic Agent</div><div class="cdesc">The neural network <b>perceives</b>, the symbolic engine <b>reasons</b>. Here\'s the architecture in Python.</div>'+'<div class="code hf" data-f="📄 neuro_symbolic_agent.py"><span class="kw">import</span> torch<br><span class="kw">from</span> symbolic_engine <span class="kw">import</span> <span class="fn">LogicProgram</span>, <span class="fn">Rule</span><br><br><span class="kw">class</span> <span class="ty">NeuroSymbolicAgent</span>:<br>&nbsp;&nbsp;<span class="kw">def</span> <span class="fn">__init__</span>(self):<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm"># Neural: perceives the world</span><br>&nbsp;&nbsp;&nbsp;&nbsp;self.perception = <span class="fn">VisionEncoder</span>(pretrained=<span class="kw">True</span>)<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm"># Symbolic: reasons about it</span><br>&nbsp;&nbsp;&nbsp;&nbsp;self.reasoner = <span class="fn">LogicProgram</span>()<br>&nbsp;&nbsp;&nbsp;&nbsp;self.reasoner.<span class="fn">add_rule</span>(<span class="fn">Rule</span>(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="st">"can_stack(X,Y) :- size(X) &lt; size(Y)"</span><br>&nbsp;&nbsp;&nbsp;&nbsp;))<br>&nbsp;&nbsp;&nbsp;&nbsp;self.reasoner.<span class="fn">add_rule</span>(<span class="fn">Rule</span>(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="st">"safe_move(X,From,To) :- can_stack(X,top(To))"</span><br>&nbsp;&nbsp;&nbsp;&nbsp;))<br><br>&nbsp;&nbsp;<span class="kw">def</span> <span class="fn">act</span>(self, observation):<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm"># Step 1: Neural perception</span><br>&nbsp;&nbsp;&nbsp;&nbsp;concepts = self.perception.<span class="fn">extract</span>(observation)<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm"># → {objects: [{type:"disk",size:3,peg:"A"}, ...]}</span><br><br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm"># Step 2: Symbolic planning</span><br>&nbsp;&nbsp;&nbsp;&nbsp;plan = self.reasoner.<span class="fn">solve</span>(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;state=concepts, goal=<span class="st">"all_on(peg_C)"</span><br>&nbsp;&nbsp;&nbsp;&nbsp;)<br><br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm"># Step 3: Verify before acting</span><br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">assert</span> self.reasoner.<span class="fn">verify</span>(plan)<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> plan[<span class="nb">0</span>]</div>'+'<div class="code hf" data-f="📄 concept_learning.py — Learning New Rules"><span class="cm"># Neural nets LEARN new symbolic concepts from data</span><br><span class="cm"># No hand-coding required!</span><br><br><span class="kw">def</span> <span class="fn">learn_concept</span>(agent, examples):<br>&nbsp;&nbsp;<span class="kw">for</span> img, label <span class="kw">in</span> examples:<br>&nbsp;&nbsp;&nbsp;&nbsp;features = agent.perception.<span class="fn">extract</span>(img)<br>&nbsp;&nbsp;&nbsp;&nbsp;agent.reasoner.<span class="fn">induce_rule</span>(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;concept=<span class="st">"stackable"</span>,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;positive=features <span class="kw">if</span> label <span class="kw">else</span> <span class="kw">None</span>,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;negative=features <span class="kw">if not</span> label <span class="kw">else</span> <span class="kw">None</span>,<br>&nbsp;&nbsp;&nbsp;&nbsp;)<br>&nbsp;&nbsp;<span class="fn">print</span>(agent.reasoner.rules[<span class="st">"stackable"</span>])<br>&nbsp;&nbsp;<span class="cm"># → "stackable(X) :- flat_top(X), weight(X) &lt; 5"</span></div>'+'<div class="hint" style="background:rgba(168,255,61,.04);border:1px solid rgba(168,255,61,.15)"><b style="color:var(--lime)">🔑 Breakthrough:</b> Unlike old symbolic AI where humans coded all rules, neuro-symbolic systems <b>learn rules from data</b>, then <b>reason with them</b>. Best of both worlds.</div>'+nb();};
