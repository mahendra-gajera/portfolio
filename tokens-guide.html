<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokens & Tokenization: The Currency of AI — Simplified by Mahendra Gajera</title>
<style>
:root{--bg:#0a0a0f;--card:#12121a;--card2:#1a1a28;--border:#2a2a3d;--text:#e8e8f0;--sub:#7a7a9a;--gold:#f0b232;--green:#34d399;--blue:#60a5fa;--red:#f87171;--purple:#a78bfa;--cyan:#22d3ee;--orange:#fb923c;--pink:#f472b6;--lime:#a3e635;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Courier New','SF Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;}
.app{max-width:900px;margin:0 auto;padding:28px 16px 50px;}

.hdr{text-align:center;margin-bottom:30px;position:relative;}
.hdr::before{content:'';position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:400px;height:200px;background:radial-gradient(ellipse,rgba(240,178,50,.1),transparent 70%);pointer-events:none;}
.hdr .coin{font-size:2.8rem;display:block;margin-bottom:6px;filter:drop-shadow(0 0 12px rgba(240,178,50,.4));}
.hdr h1{font-family:Georgia,serif;font-size:2.1rem;line-height:1.2;}
.hdr h1 em{font-style:normal;color:var(--gold);}
.hdr .sub{font-size:.85rem;color:var(--sub);margin-top:6px;font-family:Georgia,serif;}
.hdr .sub b{color:var(--gold);}

.prog{display:flex;gap:3px;margin-bottom:24px;}
.prog .s{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s;}
.prog .s.done{background:var(--gold);}
.prog .s.on{background:var(--gold);box-shadow:0 0 8px rgba(240,178,50,.5);}

.nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:22px;padding:8px;background:var(--card);border-radius:10px;border:1px solid var(--border);}
.nav button{padding:5px 11px;border-radius:6px;border:1px solid transparent;background:none;color:var(--sub);font-size:.72rem;font-family:inherit;cursor:pointer;transition:all .2s;white-space:nowrap;}
.nav button:hover{color:var(--text);background:var(--card2);}
.nav button.on{color:var(--gold);border-color:var(--gold);background:rgba(240,178,50,.08);}

.crd{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;min-height:400px;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:700;margin-bottom:14px;border:1px solid;}
.ctitle{font-family:Georgia,serif;font-size:1.3rem;color:var(--text);margin-bottom:6px;}
.cdesc{font-size:.85rem;color:var(--sub);margin-bottom:18px;line-height:1.7;font-family:Georgia,serif;}
.cdesc b{color:var(--text);}

.code{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin:12px 0;overflow-x:auto;font-size:.8rem;line-height:1.7;position:relative;}
.code.hf{padding-top:32px;}
.code::before{content:attr(data-f);position:absolute;top:0;left:0;right:0;padding:4px 12px;background:var(--card2);border-bottom:1px solid var(--border);border-radius:8px 8px 0 0;font-size:.68rem;color:var(--sub);}
.kw{color:var(--purple);}
.fn{color:var(--blue);}
.st{color:var(--green);}
.cm{color:var(--sub);font-style:italic;}
.nb{color:var(--orange);}
.ty{color:var(--cyan);}

.arch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px 0;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;}
.abox{padding:10px 14px;border-radius:10px;border:1.5px solid;text-align:center;font-size:.76rem;font-weight:700;min-width:85px;transition:transform .2s;}
.abox:hover{transform:translateY(-2px);}
.abox .ic{font-size:1.3rem;display:block;margin-bottom:2px;}
.aarr{font-size:1.1rem;color:var(--sub);}

.metrics{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
.metric{flex:1;min-width:110px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--border);text-align:center;}
.metric .v{font-size:1.5rem;font-weight:800;}
.metric .l{font-size:.7rem;color:var(--sub);margin-top:2px;}

.term{background:#000;border:1px solid var(--border);border-radius:8px;padding:12px;margin:12px 0;font-size:.78rem;line-height:1.8;}
.term .p{color:var(--green);}
.term .c{color:var(--text);}
.term .o{color:var(--sub);}
.term .ok{color:var(--green);}

.ftr{text-align:center;margin-top:30px;font-size:.85rem;color:var(--sub);}
.ftr b{color:var(--gold);}

/* Token visualizer */
.tok-vis{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;}
.tok{padding:4px 8px;border-radius:5px;font-size:.82rem;font-weight:700;border:1px solid;cursor:default;transition:transform .15s;}
.tok:hover{transform:scale(1.08);}

/* Cost calculator */
.calc-row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap;}
.calc-label{font-size:.82rem;color:var(--sub);min-width:100px;}
.calc-input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-family:inherit;font-size:.85rem;width:120px;}
.calc-input:focus{outline:none;border-color:var(--gold);}
.calc-result{padding:14px;border-radius:10px;background:rgba(240,178,50,.06);border:1px solid rgba(240,178,50,.25);text-align:center;margin:12px 0;}
.calc-result .big{font-size:1.8rem;font-weight:800;color:var(--gold);font-family:'Courier New',monospace;}

/* Bar chart */
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.78rem;}
.bar-label{min-width:130px;color:var(--sub);text-align:right;}
.bar-fill{height:20px;border-radius:4px;transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.7rem;font-weight:700;color:var(--bg);}

@media(max-width:600px){.hdr h1{font-size:1.6rem;}.crd{padding:16px;}.calc-input{width:90px;}}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <span class="coin">🪙</span>
    <h1>Tokens & Tokenization:<br><em>The Currency of AI</em></h1>
    <div class="sub">Everything you need to know about AI's money system · <b>by Mahendra Gajera</b></div>
    <button id="toggleSound" style="position:absolute;top:10px;right:20px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--sub);font-size:.7rem;cursor:pointer;transition:all .2s">🔊 Sound</button>
  </div>
  <div class="prog" id="prog"></div>
  <div class="nav" id="nav"></div>
  
  <!-- Live Token Counter -->
  <div id="tokenCounter" style="margin-bottom:16px;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:none">
    <div style="font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px">⚡ Live Token Counter</div>
    <textarea id="tokenInput" placeholder="Paste or type text here to count tokens..." style="width:100%;height:80px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);padding:8px;font-family:monospace;font-size:.78rem;resize:vertical;margin-bottom:8px"></textarea>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="flex:1;font-size:.8rem;color:var(--sub)">Estimated tokens: <span id="tokenCount" style="color:var(--gold);font-weight:700">0</span></div>
      <div style="font-size:.72rem;color:var(--sub)">~<span id="costEst" style="color:var(--gold)">$0.00</span>/1M in</div>
    </div>
  </div>
  
  <div class="crd" id="crd"></div>
  
  <!-- Completion Achievement -->
  <div id="achievement" style="position:fixed;bottom:20px;right:20px;padding:12px 16px;border-radius:10px;background:var(--card);border:2px solid var(--gold);display:none;z-index:1000;animation:slideInRight .3s ease-out">
    <div style="font-size:.9rem;color:var(--gold);font-weight:700">🏆 Section Complete!</div>
    <div style="font-size:.72rem;color:var(--sub);margin-top:2px" id="achievementText"></div>
  </div>
  
  <div class="ftr">🪙 <b>Tokens Guide by Mahendra Gajera</b> 🪙 · Press ← → to navigate</div>
</div>

<style>
@keyframes slideInRight {
  from { transform: translateX(400px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes fadeInSection {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes countUp {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
#crd { animation: fadeInSection .4s ease-out; }
.expandable { cursor: pointer; user-select: none; }
.expandable:hover { color: var(--gold); }
.expandable::before { content: "▶ "; display: inline-block; transition: transform .2s; color: var(--gold); }
.expandable.open::before { transform: rotate(90deg); }
.expandable-content { display: none; margin-top: 8px; padding: 10px; border-left: 2px solid var(--gold); background: var(--bg); border-radius: 6px; }
.expandable.open + .expandable-content { display: block; animation: fadeInSection .2s ease-out; }
.copy-btn { padding: 3px 8px; font-size: .68rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--sub); cursor: pointer; transition: all .2s; margin-left: 8px; float: right; }
.copy-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(240,178,50,.1); }
.copy-btn.copied { color: var(--green); border-color: var(--green); }
.tooltip { position: relative; cursor: help; border-bottom: 1px dotted var(--gold); }
.tooltip:hover::after { content: attr(data-tooltip); position: absolute; bottom: 120%; left: 0; background: var(--card2); color: var(--gold); padding: 6px 10px; border-radius: 6px; font-size: .7rem; white-space: nowrap; z-index: 1000; border: 1px solid var(--gold); }
.counter { display: inline-block; animation: countUp .5s ease-out; }
</style>

<script>
// ═════ CONFIG ═════
var soundEnabled = true;
var ST=[
  {id:"what",n:0,t:"What Are Tokens?",ic:"🪙",c:"var(--gold)"},
  {id:"how",n:1,t:"How Tokenization Works",ic:"✂️",c:"var(--blue)"},
  {id:"types",n:2,t:"Tokenizer Types",ic:"🔤",c:"var(--purple)"},
  {id:"count",n:3,t:"Counting Tokens",ic:"🔢",c:"var(--green)"},
  {id:"context",n:4,t:"Context Windows",ic:"📏",c:"var(--cyan)"},
  {id:"money",n:5,t:"Tokens = Money",ic:"💰",c:"var(--gold)"},
  {id:"calc",n:6,t:"Cost Calculator",ic:"🧮",c:"var(--orange)"},
  {id:"save",n:7,t:"Save Tokens",ic:"💡",c:"var(--lime)"},
  {id:"manage",n:8,t:"Token Management",ic:"⚙️",c:"var(--blue)"},
  {id:"prod",n:9,t:"Production Tips",ic:"🚀",c:"var(--red)"},
];

var cur=0,timers=[];
var nav=document.getElementById("nav"),prog=document.getElementById("prog"),crd=document.getElementById("crd");

// ═════ UTILITIES ═════
function clr(){for(var i=0;i<timers.length;i++){clearInterval(timers[i]);clearTimeout(timers[i]);}timers=[];}
function h(tag,sty,html){var e=document.createElement(tag);if(sty)for(var k in sty)e.style[k]=sty[k];if(html!==undefined)e.innerHTML=html;return e;}
function bg(i){var s=ST[i];return '<div class="badge" style="color:'+s.c+';border-color:'+s.c+'">'+s.ic+' Step '+s.n+'</div>';}
function playSound(type){if(!soundEnabled)return;var ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),env=ctx.createGain();ctx.destination.connect(env);env.connect(ctx.destination);var now=ctx.currentTime;env.setValueAtTime(.1,now);env.exponentialRampToValueAtTime(.01,now+.1);osc.connect(env);osc.type='sine';osc.frequency.setValueAtTime(type==='click'?800:1200,now);osc.start(now);osc.stop(now+.1);}
function animateCounter(el,from,to,suffix){
  var step=(to-from)/30,curr=from,started=Date.now();
  function update(){
    curr+=step;
    if(step>0?curr>=to:curr<=to){curr=to;}
    el.textContent=Math.floor(curr)+suffix;
    if(curr!==to){timers.push(requestAnimationFrame(update));}
  }
  update();
}
function showAchievement(msg){
  var a=document.getElementById("achievement");
  document.getElementById("achievementText").textContent=msg;
  a.style.display="block";
  playSound('click');
  timers.push(setTimeout(function(){a.style.display="none";},2500));
}

// ═════ TOKEN COUNTER ═════
function initTokenCounter(){
  var inp=document.getElementById("tokenInput"),counter=document.getElementById("tokenCounter");
  if(!inp)return;
  inp.oninput=function(){
    var text=inp.value;
    var tokens=Math.ceil(text.length/4);
    document.getElementById("tokenCount").textContent=tokens;
    document.getElementById("costEst").textContent="$"+(tokens/1e6*.15).toFixed(5);
  };
}

// ═════ COPY TO CLIPBOARD ═════
function addCopyButtons(){
  var codes=crd.querySelectorAll(".code");
  for(var i=0;i<codes.length;i++){
    var code=codes[i],btn=h("button");
    btn.className="copy-btn";
    btn.textContent="📋 Copy";
    btn.onclick=(function(c){return function(){
      var text=c.textContent.replace(/^[^\n]+\n/,'');
      navigator.clipboard.writeText(text);
      playSound('click');
      btn.textContent="✓ Copied!";
      btn.className="copy-btn copied";
      timers.push(setTimeout(function(){btn.textContent="📋 Copy";btn.className="copy-btn";},1500));
    };})(code);
    code.parentNode.insertBefore(btn,code.nextSibling);
  }
}

// ═════ EXPANDABLE SECTIONS ═════
function makeExpandable(titleText){
  return '<div class="expandable" onclick="this.classList.toggle(\'open\');playSound(\'click\')" style="color:var(--sub);font-weight:700;margin:12px 0;font-size:.85rem">'+titleText+'</div>';
}

// ═════ ANIMATED COUNTER ═════
function countNum(num,suffix){
  return '<span class="counter" data-count="'+num+'" data-suffix="'+suffix+'">'+num+suffix+'</span>';
}

// ═════ NAV & PROGRESS ═════
for(var i=0;i<ST.length;i++){
  var sg=document.createElement("div");sg.className="s";sg.id="sg_"+i;prog.appendChild(sg);
  (function(i){var b=document.createElement("button");b.textContent=ST[i].ic+" "+ST[i].t;b.id="nb_"+i;b.onclick=function(){go(i);};nav.appendChild(b);})(i);
}

// ═════ NAVIGATION ═════
function go(idx){
  clr();cur=idx;
  for(var j=0;j<ST.length;j++){
    document.getElementById("sg_"+j).className="s"+(j<idx?" done":"")+(j===idx?" on":"");
    document.getElementById("nb_"+j).className=j===idx?"on":"";
  }
  crd.innerHTML="";D[ST[idx].id]();
  playSound('click');
  addCopyButtons();
  makeCodeBlocksInteractive();
  setTimeout(function(){animateAllCounters();initTokenCounter();},100);
  showAchievement("Section "+cur+" loaded");
}

// ═════ KEYBOARD NAV ═════
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"&&cur<9){go(cur+1);}
  else if(e.key==="ArrowLeft"&&cur>0){go(cur-1);}
});

// ═════ SOUND TOGGLE ═════
document.getElementById("toggleSound").onclick=function(){
  soundEnabled=!soundEnabled;
  this.style.opacity=soundEnabled?"1":".5";
  playSound('click');
};

// ═════ MAKE CODE BLOCKS INTERACTIVE ═════
function makeCodeBlocksInteractive(){
  var codes=crd.querySelectorAll(".code");
  for(var i=0;i<codes.length;i++){
    codes[i].style.cursor="pointer";
    codes[i].style.transition="all .2s";
    codes[i].onmouseover=function(){this.style.borderColor="var(--gold)";this.style.boxShadow="0 0 12px rgba(240,178,50,.15)";};
    codes[i].onmouseout=function(){this.style.borderColor="var(--border)";this.style.boxShadow="none";};
  }
}

// ═════ ANIMATE COUNTERS ═════
function animateAllCounters(){
  var counters=crd.querySelectorAll(".counter");
  for(var i=0;i<counters.length;i++){
    var c=counters[i],num=parseInt(c.getAttribute("data-count")),suffix=c.getAttribute("data-suffix")||"";
    animateCounter(c,0,num,suffix);
  }
}

// ═════ NEXT/PREV BUTTONS ═════
function nb(i){
  var d=h("div",{display:"flex",justifyContent:"space-between",marginTop:"20px"});
  if(i>0){var b=document.createElement("button");b.style.cssText="padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--sub);font-size:.78rem;font-family:inherit;cursor:pointer;transition:all .2s";b.onmouseover=function(){this.style.borderColor="var(--gold)";this.style.color="var(--gold)";};b.onmouseout=function(){this.style.borderColor="var(--border)";this.style.color="var(--sub)";};b.textContent="← "+ST[i-1].t;b.onclick=function(){go(i-1);};d.appendChild(b);}else d.appendChild(h("div"));
  if(i<9){var b=document.createElement("button");b.style.cssText="padding:6px 14px;border-radius:6px;border:1px solid var(--gold);background:rgba(240,178,50,.08);color:var(--gold);font-size:.78rem;font-family:inherit;cursor:pointer;transition:all .2s";b.onmouseover=function(){this.style.background="rgba(240,178,50,.15)";};b.onmouseout=function(){this.style.background="rgba(240,178,50,.08)";};b.textContent=ST[i+1].t+" →";b.onclick=function(){go(i+1);};d.appendChild(b);}
  return d;
}

var D={};

// ─── 0. WHAT ARE TOKENS ───
D.what=function(){
  crd.innerHTML=bg(0)+'<div class="ctitle">What Exactly Is a Token?</div>'
  +'<div class="cdesc">A <b>token</b> is the smallest unit AI reads. Not a word, not a character — something in between. Think of it as AI\'s alphabet. Every single thing an AI reads, thinks about, or writes is measured in tokens.</div>';

  // Visual
  crd.innerHTML+='<div style="font-size:.82rem;font-weight:700;color:var(--gold);margin:12px 0 6px">🪙 See it in action (click to reveal):</div>';

  var examples=[
    {text:"Hello world",tokens:["Hello"," world"],colors:["#f0b232","#60a5fa"],count:2},
    {text:"Tokenization is fascinating!",tokens:["Token","ization"," is"," fascinating","!"],colors:["#f0b232","#34d399","#60a5fa","#a78bfa","#fb923c"],count:5},
    {text:"I'm learning AI",tokens:["I","'m"," learning"," AI"],colors:["#f0b232","#f87171","#22d3ee","#a78bfa"],count:4},
  ];

  for(var i=0;i<examples.length;i++){
    var ex=examples[i];
    var row=h("div",{marginBottom:"10px",padding:"8px",borderRadius:"6px",background:"var(--bg)",cursor:"pointer",transition:"all .2s",border:"1px solid var(--border)"});
    row.onclick=(function(row,ex){return function(){row.classList.toggle("open");playSound("click");};})(row,ex);
    row.innerHTML='<div style="font-size:.78rem;color:var(--sub);margin-bottom:4px;font-weight:700">"'+ex.text+'" → <span class="counter" data-count="'+ex.count+'" data-suffix=" tokens" style="color:var(--gold);font-weight:700">0 tokens</span></div>';
    var vis=h("div",{display:"flex",flexWrap:"wrap",gap:"3px"});
    for(var j=0;j<ex.tokens.length;j++){
      vis.innerHTML+='<span class="tok" style="color:'+ex.colors[j]+';border-color:'+ex.colors[j]+'40;background:'+ex.colors[j]+'12;transition:all .2s" onmouseover="this.style.transform=\'scale(1.15)\'" onmouseout="this.style.transform=\'scale(1)\'">'+ex.tokens[j].replace(/ /g,"·")+'</span>';
    }
    row.appendChild(vis);
    crd.appendChild(row);
  }

  // Key insight - expandable
  var keyBox=h("div",{marginTop:"16px",padding:"14px",borderRadius:"10px",background:"rgba(240,178,50,.06)",border:"1px solid rgba(240,178,50,.25)"});
  keyBox.innerHTML='<div style="font-size:.85rem;font-weight:700;color:var(--gold);margin-bottom:6px;cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\';playSound(\'click\')" style="cursor:pointer">💡 Key Insight [Click to expand]</div>'
    +'<div style="font-size:.82rem;color:var(--sub);line-height:1.7;font-family:Georgia,serif">'
    +'<b style="color:var(--text)">1 token ≈ 4 characters ≈ ¾ of a word</b> (in English)<br>'
    +'• "ChatGPT" = '+countNum(3,'')+ ' tokens (Chat + G + PT)<br>'
    +'• "a" = '+countNum(1,'')+ ' token, "the" = '+countNum(1,'')+ ' token<br>'
    +'• "extraordinary" = '+countNum(3,'')+ ' tokens<br>'
    +'• Emojis & special chars = multiple tokens<br>'
    +'• Non-English text = more tokens per word</div>';
  crd.appendChild(keyBox);
  
  // Add token counter for this section
  crd.innerHTML+='<div style="margin-top:14px;padding:10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">'
  +'<div style="font-size:.78rem;color:var(--sub);margin-bottom:6px;font-weight:700">Try it: Count tokens in any text</div>'
  +'<input type="text" placeholder="Type something..." style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:.78rem;font-family:monospace" oninput="var t=this.value.length;this.parentNode.querySelector(\'.tok-result\').textContent=Math.ceil(t/4)+" tokens (~$"+(Math.ceil(t/4)/1e6*.15).toFixed(5)+")">'
  +'<div class="tok-result" style="margin-top:6px;font-size:.78rem;color:var(--gold);font-weight:700">0 tokens</div>'
  +'</div>';
  
  crd.appendChild(nb(0));
};

// ─── 1. HOW TOKENIZATION WORKS ───
D.how=function(){
  crd.innerHTML=bg(1)+'<div class="ctitle">How Tokenization Actually Works</div>'
  +'<div class="cdesc">The AI doesn\'t see text like you do. It breaks everything into <b>tokens</b> using a trained vocabulary, then converts each token into a number (ID). These numbers are what the model actually processes.</div>';

  // Step by step flow
  var steps=[
    {ic:"📝",label:"Raw Text",val:'"The cat sat on the mat"',c:"var(--text)"},
    {ic:"✂️",label:"Tokenize",val:'["The", " cat", " sat", " on", " the", " mat"]',c:"var(--blue)"},

    +'&nbsp;&nbsp;&nbsp;&nbsp;key = <span class="st">f"tokens:{user_id}:{datetime.now():%Y-%m-%d}"</span><br>'

    +'&nbsp;&nbsp;<span class="kw">def</span> <span class="fn">trim_history</span>(self, messages, max_tokens):<br>'
    +'&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm"># Keep system + last N messages within budget</span><br>'
    +'&nbsp;&nbsp;&nbsp;&nbsp;total = <span class="nb">0</span><br>'

    +'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;t = self.<span class="fn">count</span>(msg[<span class="st">"content"</span>])<br>'
    +'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> total + t > max_tokens: <span class="kw">break</span><br>'
    +'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;kept.<span class="fn">insert</span>(<span class="nb">1</span>, msg)<br>'
    +'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;total += t<br>'
    +'&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> kept<br>'
    +'</div>';
